replicaCount: 1

image:
  repository: quay.io/okdp/images/okdp-server
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

# Rendered as environment variables (see internal/config/config.go).
configuration:
  platformNamespace: okdp-system
  kubocdNamespace: kubocd-system
  # Context of the Control Plane itself: service catalog, portal categories,
  # package repository. No Release references it.
  contextName: default
  contextNamespace: kubocd-system
  # Context of the platform, the one package templates also read (ingress
  # suffix, storage classes, issuers). Empty means it is the same object as
  # above, for a deployment that has not split them yet.
  platformContextName: ""
  platformContextNamespace: kubocd-system
  # Single origin, set verbatim in the Access-Control-Allow-Origin header.
  allowedOrigins: https://okdp-ui.okdp.sandbox
  logLevel: info
  releaseInterval: 30m
  releaseTimeout: 10m
  # Comma-separated registry hosts to reach over plain HTTP (dev sandboxes
  # with a local registry). Leave empty in any real deployment.
  insecureOciRegistries: ""


service:
  type: ClusterIP
  port: 8093

resources: {}
