<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1290 480" width="1290" height="480" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1290" height="480" fill="#ffffff"/>

  <!-- ===== edges ===== -->
  <g fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="160" y1="261" x2="231" y2="261"/>
    <line x1="425" y1="261" x2="496" y2="261"/>
    <line x1="710" y1="246" x2="782" y2="173"/>
    <line x1="710" y1="276" x2="782" y2="357"/>
    <line x1="975" y1="162" x2="1046" y2="162"/>
    <line x1="975" y1="386" x2="1046" y2="386"/>
  </g>

  <!-- ===== edge labels (white halo so they never sit on a line) ===== -->
  <g font-size="11.5" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="462" y="253">REST + SSE</text>
    <text x="750" y="205">read / write</text>
    <text x="748" y="321">catalog</text>
    <text x="748" y="335">+ Releases</text>
    <text x="1012" y="379">reconciles</text>
  </g>

  <!-- ===== boxes ===== -->
  <g fill="#ffffff" stroke="#111111">
    <rect x="30"   y="230" width="130" height="62" rx="6" stroke-width="1.4"/>
    <rect x="235"  y="226" width="190" height="70" rx="6" stroke-width="1.4"/>
    <rect x="500"  y="220" width="210" height="82" rx="6" stroke-width="2.6"/>
    <rect x="785"  y="128" width="190" height="68" rx="6" stroke-width="1.4"/>
    <rect x="785"  y="352" width="190" height="68" rx="6" stroke-width="1.4"/>
    <rect x="1050" y="128" width="200" height="68" rx="6" stroke-width="1.4"/>
    <rect x="1050" y="352" width="210" height="68" rx="6" stroke-width="1.4"/>
  </g>

  <!-- ===== box titles ===== -->
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="95"   y="258">User</text>
    <text x="330"  y="258">OKDP Console</text>
    <text x="605"  y="256" font-size="16" font-weight="bold">Control Plane Server</text>
    <text x="880"  y="159">Kubernetes API</text>
    <text x="880"  y="383">KuboCD</text>
    <text x="1150" y="159">Project namespaces</text>
    <text x="1155" y="383">Data services</text>
  </g>

  <!-- ===== box explanations (parentheses) ===== -->
  <g font-size="11.5" fill="#555555" text-anchor="middle">
    <text x="95"   y="276">(operator)</text>
    <text x="330"  y="276">(okdp-control-plane-ui)</text>
    <text x="605"  y="276">(okdp-control-plane-server)</text>
    <text x="880"  y="177">(cluster control plane)</text>
    <text x="880"  y="401">(GitOps engine)</text>
    <text x="1150" y="177">(okdp.io/project=*)</text>
    <text x="1155" y="401">(Trino, Superset, JupyterHub, …)</text>
  </g>
</svg>
