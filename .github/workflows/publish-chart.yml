name: publish-chart

# Package the Helm chart and publish it to an OCI registry:
# oci://<registry>/<chart-name>. Triggered on published releases (cut by
# release-please) so the chart version matches the released version.
#
# The registry defaults to the OKDP one. A fork that must not push there sets
# the CHART_REGISTRY repository variable instead of diverging from this file:
# a chart nobody can pull is a package nobody can build.

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    # packages: write is what ghcr needs; quay ignores it.
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: |
          VERSION=$(jq -r '.["."] // "0.1.0"' .release-please-manifest.json)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4
      - name: Package and push chart
        env:
          CHART_REGISTRY: ${{ vars.CHART_REGISTRY || 'quay.io/okdp/charts' }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME || github.actor }}
          REGISTRY_ROBOT_TOKEN: ${{ secrets.REGISTRY_ROBOT_TOKEN || secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.vars.outputs.version }}
        run: |
          REGISTRY_HOST="${CHART_REGISTRY%%/*}"
          echo "$REGISTRY_ROBOT_TOKEN" | helm registry login "$REGISTRY_HOST" -u "$REGISTRY_USERNAME" --password-stdin
          helm package chart --version "$VERSION" --app-version "$VERSION"
          helm push "okdp-server-$VERSION.tgz" "oci://$CHART_REGISTRY"
